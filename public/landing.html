<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web IDS & IPS System - Secure Access</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .landing-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
            padding: 20px;
        }

        .landing-content {
            max-width: 600px;
            animation: fadeInUp 0.8s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .landing-logo {
            font-size: 64px;
            margin-bottom: 20px;
            color: white;
        }

        .landing-title {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 20px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        .landing-subtitle {
            font-size: 20px;
            margin-bottom: 40px;
            opacity: 0.9;
            line-height: 1.6;
        }

        .auth-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .auth-btn {
            padding: 18px 40px;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        .auth-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(0,0,0,0.3);
        }

        .btn-login {
            background: white;
            color: #667eea;
        }

        .btn-register {
            background: rgba(255,255,255,0.1);
            color: white;
            border: 2px solid white;
            backdrop-filter: blur(10px);
        }

        .btn-register:hover {
            background: rgba(255,255,255,0.2);
        }

        .security-notice {
            margin-top: 60px;
            padding: 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .security-notice h3 {
            margin-bottom: 10px;
            font-size: 18px;
        }

        .security-notice p {
            margin: 5px 0;
            font-size: 14px;
            opacity: 0.8;
        }

        @media (max-width: 640px) {
            .landing-title {
                font-size: 36px;
            }
            
            .landing-subtitle {
                font-size: 18px;
            }
            
            .auth-buttons {
                flex-direction: column;
                align-items: center;
            }
            
            .auth-btn {
                width: 250px;
            }
        }
    </style>
</head>
<body>
    <div class="landing-container">
        <div class="landing-content">
            <div class="landing-logo">
                <i class="fas fa-shield-alt"></i>
            </div>
            
            <h1 class="landing-title">Web IDS & IPS System</h1>
            
            <p class="landing-subtitle">
                Advanced Intrusion Detection and Prevention System<br>
                with Multi-Factor Authentication
            </p>
            
            <div class="auth-buttons">
                <a href="/login" class="auth-btn btn-login">
                    <i class="fas fa-sign-in-alt"></i>
                    Login
                </a>
                <a href="/register" class="auth-btn btn-register">
                    <i class="fas fa-user-plus"></i>
                    Register
                </a>
            </div>
            
            <div class="security-notice">
                <h3><i class="fas fa-lock"></i> Security Features</h3>
                <p><i class="fas fa-check"></i> Real-time Intrusion Detection (IDS)</p>
                <p><i class="fas fa-check"></i> Automatic Intrusion Prevention (IPS)</p>
                <p><i class="fas fa-check"></i> 3-Factor Authentication</p>
                <p><i class="fas fa-check"></i> SQL Injection & XSS Protection</p>
            </div>
        </div>
    </div>
</body>
</html>
